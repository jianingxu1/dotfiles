# Reload tmux settings with <leader> + r
unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

# Disable default prefix to avoid accidental mixed prefix usage.
unbind C-b

# Make key handling feel immediate for Esc/Alt sequences.
set -s escape-time 0

# Keep repeatable prefix bindings active briefly (e.g., C-n/C-p cycling).
set -g repeat-time 400

# Enable mouse scrolling
set -g mouse on

# Increase scrollback for long logs and command output.
set -g history-limit 100000

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# Allow escape sequences to pass through to terminal
set -g allow-passthrough on

# Forward bells from ALL panes to terminal (not just the active one)
set -g bell-action any

# Enable bell monitoring
set -g monitor-bell on

# Activity monitoring disabled - rely only on bell monitoring for notifications
set -g monitor-activity off

# Prefer the status-line bell indicators over flashing the pane
set -g visual-bell off

# Ensure tmux doesn't jump or flash the status bar
set -g visual-activity off

# 2. Define the format: [Index]:[Name][Yellow Bell if Bell]
# This says: If bell exists, print " 🔔". If not, print nothing.
set -g window-status-format "#I:#W#{?window_bell_flag,#[fg=yellow]🔔#[default],}"

# Current Window: [Index]:[Name] followed by the Circle icon
set -g window-status-current-format "#[fg=bold]#I:#W📍#[default]"

# Force the bell and activity styles to be "empty"
setw -g window-status-activity-style bg=default,fg=default,none
setw -g window-status-bell-style bg=default,fg=default,none

# Keep tmux default window keys, but make them repeatable after prefix
bind-key -r n next-window
bind-key -r p previous-window

# Jump back to the previous window quickly.
bind-key -r Tab last-window

# Act like vim
setw -g mode-keys vi

# Keep pane movement on vim keys and allow quick repeats.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# Resize panes with uppercase vim keys in repeat mode.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 3
bind-key -r K resize-pane -U 3
bind-key -r L resize-pane -R 5
